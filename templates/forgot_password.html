{% extends 'base.html' %}
{% set title='忘記密碼' %}
{% block content %}
<div class="card" style="max-width:560px;margin:30px auto">
    <h2>忘記密碼</h2>
    <p class="muted" style="margin-top:-6px;">請輸入註冊 Email 與你設定的安全問題答案。</p>
    <form method="post" class="form-grid">
        <div class="field" style="grid-column:1/-1"><label>Email</label><input name="email" type="email" required placeholder="name@cloud.fju.edu.tw"></div>
        <div class="field" style="grid-column:1/-1"><label>安全問題答案</label><input name="security_answer" minlength="2" maxlength="50" required placeholder="例如：籃球、貓咪、咖啡、音樂"></div>
        <button class="btn" type="submit">驗證並重設密碼</button>
    </form>
    <p style="text-align:center;margin-top:14px;"><a href="{{ url_for('auth.login') }}">返回登入</a></p>
</div>
{% endblock %}
