{% extends 'base.html' %}
{% set title='註冊' %}
{% block content %}
<div class="card" style="max-width:560px;margin:30px auto">
    <h2>註冊帳號</h2>
    <form method="post" class="form-grid">
        <div class="field"><label>姓名</label><input name="name" required></div>
        <div class="field" style="grid-column:1/-1">
            <label>MAIL</label>
            <input id="registerEmail" name="email" type="email" required placeholder="name@cloud.fju.edu.tw" pattern="^[^\s@]+@cloud\.fju\.edu\.tw$" title="僅限 @cloud.fju.edu.tw 帳號" style="width:100%;">
            <small class="muted" style="display:block;margin-top:6px;">僅限 @cloud.fju.edu.tw 帳號註冊。</small>
        </div>
        <div class="field" style="grid-column:1/-1"><label>你喜歡的事物是什麼？</label><input name="security_answer" minlength="2" maxlength="50" required placeholder="例如：籃球、貓咪、咖啡、音樂"></div>
        <div class="field" style="grid-column:1/-1"><label>密碼</label><input name="password" type="password" required>
        </div>
        <button class="btn" type="submit">註冊</button>
    </form>
</div>

<script>
(() => {
    const form = document.querySelector('form[method="post"]');
    const registerEmail = document.getElementById('registerEmail');

    if (!form || !registerEmail) {
        return;
    }

    form.addEventListener('submit', () => {
        const submitButton = form.querySelector('button[type="submit"]');
        if (submitButton) {
            submitButton.disabled = true;
            submitButton.textContent = '送出中...';
        }
    });
})();
</script>
{% endblock %}
