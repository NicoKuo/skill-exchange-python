{% extends 'base.html' %}
{% set title='重設密碼' %}
{% block content %}
<div class="card" style="max-width:560px;margin:30px auto">
    <h2>重設密碼</h2>
    <p class="muted" style="margin-top:-6px;">請設定新的登入密碼。</p>
    <form method="post" class="form-grid">
        <div class="field" style="grid-column:1/-1"><label>新密碼</label><input name="new_password" type="password" required minlength="6" placeholder="至少 6 碼"></div>
        <div class="field" style="grid-column:1/-1"><label>確認密碼</label><input name="confirm_password" type="password" required minlength="6" placeholder="再次輸入新密碼"></div>
        <button class="btn" type="submit">更新密碼</button>
    </form>
</div>
{% endblock %}
